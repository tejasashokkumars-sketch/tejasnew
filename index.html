<!DOCTYPE html>
<html>
<head>
    <title>Thank You ❤️</title>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        /* 🌈 Animated Gradient Background */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ff4d6d, #ff9a9e, #8ec5fc, #a18cd1);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            filter: blur(20px);
            z-index: -2;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 📦 Glass container */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            transition: all 0.6s ease;
        }

        .hidden {
            opacity: 0;
            transform: translate(-50%, 100%);
        }

        input, button {
            padding: 10px;
            font-size: 18px;
            border-radius: 20px;
            border: none;
            margin-top: 10px;
        }

        button {
            background: #ff4d6d;
            color: white;
            cursor: pointer;
        }

        /* ❤️ Floating hearts */
        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* 💥 Burst hearts */
        .burst-heart {
            position: absolute;
            animation: burst 1s forwards;
        }

        @keyframes burst {
            to {
                transform: translate(var(--x), var(--y)) scale(1.5);
                opacity: 0;
            }
        }

        /* ✨ Sparkle */
        .sparkle {
            position: absolute;
            font-size: 12px;
            animation: sparkle 0.8s forwards;
        }

        @keyframes sparkle {
            to {
                transform: translateY(-20px);
                opacity: 0;
            }
        }

        /* 💌 Envelope */
        .envelope {
            font-size: 70px;
            cursor: pointer;
        }
    </style>
</head>

<body onclick="sparkle(event); heartBurst(event)">

<!-- 💌 Envelope -->
<div class="container" id="page0">
    <div class="envelope" onclick="openEnvelope()">💌</div>
    <p>Tap to open</p>
</div>

<!-- Page 1 -->
<div class="container hidden" id="page1">
    <h2>Enter Your Name 😊</h2>
    <input type="text" id="name"><br>
    <button onclick="showMessage()">Next 💖</button>
</div>

<!-- Page 2 -->
<div class="container hidden" id="page2">
    <h2 id="message"></h2>
</div>

<!-- Page 3 -->
<div class="container hidden" id="page3">
    <h2>💖 Thanks again!</h2>
    <button onclick="restart()">Start Again 🔁</button>
</div>

<script>

// 💌 Open envelope
function openEnvelope() {
    hide("page0");
    show("page1");
}

// 🎉 Show message
function showMessage() {
    let name = document.getElementById("name").value;

    if(name === "") {
        alert("Enter your name!");
        return;
    }

    hide("page1");
    show("page2");

    confetti({ particleCount: 150, spread: 100 });

    document.getElementById("message").innerHTML =
        "Hi " + name + " ❤️<br><br>" +
        "Thank you so much for your wishes 😊<br>" +
        "ನಿಮ್ಮ ಶುಭಾಶಯಗಳು ನನಗೆ ತುಂಬಾ ಸಂತೋಷ ತಂದವು ✨<br><br>" +
        "Your words truly mean a lot to me and made me smile 💖<br><br>" +
        "Thanks again for being part of my happiness 🙏<br><br>" +
        "ಧನ್ಯವಾದಗಳು ❤️";

    // Auto move to final page after 6 seconds
    setTimeout(() => {
        hide("page2");
        show("page3");
    }, 6000);
}

// 📱 Smooth transition helpers
function show(id) {
    document.getElementById(id).classList.remove("hidden");
}

function hide(id) {
    document.getElementById(id).classList.add("hidden");
}

// 🔁 Restart
function restart() {
    hide("page3");
    show("page1");
}

// ❤️ Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 300);

// 💥 Burst hearts
function heartBurst(e) {
    for (let i = 0; i < 8; i++) {
        let h = document.createElement("div");
        h.className = "burst-heart";
        h.innerHTML = "❤️";
        h.style.left = e.clientX + "px";
        h.style.top = e.clientY + "px";
        h.style.setProperty("--x", (Math.random() * 200 - 100) + "px");
        h.style.setProperty("--y", (Math.random() * 200 - 100) + "px");
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1000);
    }
}

// ✨ Sparkle effect
function sparkle(e) {
    for (let i = 0; i < 5; i++) {
        let s = document.createElement("div");
        s.className = "sparkle";
        s.innerHTML = "✨";
        s.style.left = e.clientX + "px";
        s.style.top = e.clientY + "px";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 800);
    }
}

</script>

</body>
</html>
